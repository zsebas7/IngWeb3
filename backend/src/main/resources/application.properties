spring.application.name=gaslogix

# Muestra el stack trace en StandartResponse (desactivar en producción)
dev.info.enabled=true

spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Base de datos: el esquema se crea con db/schema.sql (Hibernate solo lo valida)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/gaslogix?verifyServerCertificate=false&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:gaslogix}
spring.datasource.password=${DB_PASS:gaslogix}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.ar.com.gaslogix=DEBUG

# Cada cuántos segundos se guarda una lectura en detalle_carga (los últimos valores de la orden se actualizan siempre)
carga.detalle.frecuencia-segundos=10
